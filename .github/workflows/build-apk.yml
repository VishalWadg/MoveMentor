name: Build & Release MoveMentor APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-and-release:
    name: Test, Build & Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Info from pubspec.yaml
        id: ver
        run: |
          BASE_VER=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d '[:space:]')
          if [ -z "$BASE_VER" ]; then
            BASE_VER="0.2.0"
          fi
          echo "tag=v${BASE_VER}" >> $GITHUB_OUTPUT
          echo "version=${BASE_VER}" >> $GITHUB_OUTPUT
          echo "Detected version: $BASE_VER (tag: v${BASE_VER})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Opening Book Asset via CI Script (Part 27.1)
        run: dart run tool/build_openings_db.dart --verify

      - name: Run static analysis & pure-Dart core tests
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          (cd packages/chess_review_core && dart pub get && dart analyze && dart test)

      - name: Run unit and contract test suite (Part 30)
        run: flutter test

      - name: Ensure Android NDK/CMake & Prepare Stockfish 19 Sources + NNUE
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(command -v sdkmanager || find "${SDK_ROOT}/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "cmake;3.22.1" "ndk;28.2.13676358"
          fi
          bash tool/prepare_android_stockfish.sh

      - name: Configure Android Signing (Optional Secrets or Debug Fallback)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "No Android signing secrets configured; building release APK signed with debug key."
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Universal & Split-ABI Release APKs
        run: |
          flutter build apk --release --build-name=${{ steps.ver.outputs.version }} --build-number=${{ github.run_number }}
          flutter build apk --release --split-per-abi --build-name=${{ steps.ver.outputs.version }} --build-number=${{ github.run_number }}

      - name: Verify Packaged Stockfish .so, NNUE Asset & 16KB ELF Alignment
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            unzip -l "$apk" | grep -q "lib/${abi}/libmovementor_stockfish.so" || { echo "Missing libmovementor_stockfish.so in $apk"; exit 1; }
            unzip -l "$apk" | grep -q "assets/flutter_assets/assets/nnue/nn-1a298aa575a0.nnue" || { echo "Missing NNUE asset in $apk"; exit 1; }
          done
          mkdir -p /tmp/verify_so
          unzip -p build/app/outputs/flutter-apk/app-arm64-v8a-release.apk lib/arm64-v8a/libmovementor_stockfish.so > /tmp/verify_so/libmovementor_stockfish.so
          READELF=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk" -name llvm-readelf 2>/dev/null | head -n 1 || command -v readelf || true)
          if [ -n "$READELF" ]; then
            echo "=== arm64-v8a ELF LOAD segments ==="
            "$READELF" -lW /tmp/verify_so/libmovementor_stockfish.so | grep LOAD
            "$READELF" -lW /tmp/verify_so/libmovementor_stockfish.so | grep -q "0x4000" || { echo "Expected 16KB (0x4000) LOAD alignment"; exit 1; }
          fi
          rm -rf /tmp/verify_so

      - name: Prepare Release Assets & SHA-256 Checksums
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/MoveMentor-${{ steps.ver.outputs.tag }}-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/MoveMentor-${{ steps.ver.outputs.tag }}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/MoveMentor-${{ steps.ver.outputs.tag }}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/MoveMentor-${{ steps.ver.outputs.tag }}-x86_64.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload MoveMentor APK Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: MoveMentor-APK-${{ steps.ver.outputs.tag }}-build${{ github.run_number }}
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "MoveMentor ${{ steps.ver.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/MoveMentor-${{ steps.ver.outputs.tag }}-universal.apk
            dist/MoveMentor-${{ steps.ver.outputs.tag }}-arm64-v8a.apk
            dist/MoveMentor-${{ steps.ver.outputs.tag }}-armeabi-v7a.apk
            dist/MoveMentor-${{ steps.ver.outputs.tag }}-x86_64.apk
            dist/SHA256SUMS.txt

      - name: Send Telegram Release Notification
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured in repository secrets; skipping notification."
            exit 0
          fi

          MESSAGE=$(cat <<EOF
          🚀 <b>New MoveMentor Release: ${TAG}</b>
          A new Android build has been built and published!

          <b>What's New:</b>
          • Offline-first Stockfish evaluation and move accuracy curves
          • Deterministic tactic & positional tag detection (15+ rules)
          • Modular AI Chess Mentor with GBNF grammar constraints
          • 100% offline-by-default, zero tracking, local SQLite database

          📥 <a href="https://github.com/VishalWadg/MoveMentor/releases/download/${TAG}/MoveMentor-${TAG}-universal.apk">Direct APK Download</a>
          🌐 <a href="https://github.com/VishalWadg/MoveMentor/releases/tag/${TAG}">GitHub Release Notes</a>
          EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MESSAGE}"
