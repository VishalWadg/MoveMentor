name: Release MoveMentor APK on Tag

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
      - "[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Publish MoveMentor GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Release Tag Version
        id: tag_info
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          CLEAN_VER="${TAG_NAME#v}"
          # Strip any pre-release suffix for semantic build-name if needed
          SEMVER=$(echo "$CLEAN_VER" | sed -E 's/[^0-9.].*$//')
          if [ -z "$SEMVER" ]; then
            SEMVER="0.2.0"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android platform scaffolding is complete
        run: |
          flutter create --platforms=android --project-name=movementor --org=com.movementor .

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Opening Book Asset (Part 27.1)
        run: dart run tool/build_openings_db.dart --verify

      - name: Run Golden Vectors & Provider Contract Tests (Part 30)
        run: flutter test

      - name: Configure Android Signing (Secrets or Auto-Fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          fi

      - name: Build Universal & Split-ABI Release APKs
        run: |
          flutter build apk --release --build-name=${{ steps.tag_info.outputs.semver }} --build-number=${{ github.run_number }}
          flutter build apk --release --split-per-abi --build-name=${{ steps.tag_info.outputs.semver }} --build-number=${{ github.run_number }}

      - name: Prepare Release Assets & SHA-256 Checksums
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/MoveMentor-${{ steps.tag_info.outputs.tag }}-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/MoveMentor-${{ steps.tag_info.outputs.tag }}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/MoveMentor-${{ steps.tag_info.outputs.tag }}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/MoveMentor-${{ steps.tag_info.outputs.tag }}-x86_64.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoveMentor-Release-${{ steps.tag_info.outputs.tag }}
          path: dist/*

      - name: Create GitHub Release and Attach APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "MoveMentor ${{ steps.tag_info.outputs.tag }}"
          generate_release_notes: true
          body: |
            ## MoveMentor ${{ steps.tag_info.outputs.tag }} — Offline AI Chess Mentor
            
            ### Highlights
            - **Offline-first Stockfish Analysis**: Local evaluation, Lichess-style & PDF-style move classification presets, volatility-weighted + harmonic mean accuracy, and critical moment detection.
            - **Deterministic Tactic & Positional Tagging**: 15+ rule detectors (hanging piece, fork, pin, discovered attack/check, back-rank, piece sacrifice via SEE, promotion race, king safety, pawn structure, open files).
            - **Modular AI Coach**: Choose between **Template Coach** (instant, 0 MB download), **Built-in Local Model** (Qwen3 0.6B/1.7B GGUF with GBNF grammar constraints), **Local GGUF Model** (RAM-fit checked), or **Bring-Your-Own API** (OpenAI-compatible + native vendor adapter with payload preview).
            - **Privacy & Control**: Offline-only mode on by default, zero telemetry, full JSON+PGN ZIP export, and one-tap data wipe.
            
            ### APK Downloads
            - `MoveMentor-${{ steps.tag_info.outputs.tag }}-arm64-v8a.apk` — Recommended for modern 64-bit Android devices (Android 8.0+ / API 26+).
            - `MoveMentor-${{ steps.tag_info.outputs.tag }}-universal.apk` — Universal APK for all architectures.
            - `SHA256SUMS.txt` — SHA-256 checksums for all APK files.
          files: |
            dist/MoveMentor-${{ steps.tag_info.outputs.tag }}-universal.apk
            dist/MoveMentor-${{ steps.tag_info.outputs.tag }}-arm64-v8a.apk
            dist/MoveMentor-${{ steps.tag_info.outputs.tag }}-armeabi-v7a.apk
            dist/MoveMentor-${{ steps.tag_info.outputs.tag }}-x86_64.apk
            dist/SHA256SUMS.txt
