name: movementor
description: MoveMentor — Offline-first AI Chess Mentor with Stockfish analysis, deterministic tactic tags, and modular AI coaching.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  chess: ^0.8.1
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  uuid: ^4.4.0
  file_picker: ^8.0.3
  share_plus: ^9.0.0
  archive: ^3.6.1
  pdf: ^3.10.8
  printing: ^5.12.0
  collection: ^1.18.0
  intl: ^0.19.0
  ffi: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/openings/eco_openings.json
    - assets/models/catalogue_manifest.json
    - assets/copy/en.json
    - assets/licences/notices.json
